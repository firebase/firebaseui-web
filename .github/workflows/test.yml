name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"

env:
  SAUCE_USERNAME: ${{secrets.SAUCE_USERNAME}}
  SAUCE_ACCESS_KEY: ${{secrets.SAUCE_ACCESS_KEY}}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '18'
          check-latest: true
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '11'
      - name: node_modules cache
        id: node_modules_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./node_modules
          key: ${{ runner.os }}-18-node_modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-18-node_modules-
      - name: NPM install
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci
        env:
          DETECT_CHROMEDRIVER_VERSION: 'true'
      - name: Build & run tests
        run: npm run test
      - name: Run tests in Saucelabs
        run: |
          ./buildtools/sauce_connect.sh &
          ./buildtools/run_tests.sh --saucelabs
